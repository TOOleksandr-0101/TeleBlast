name: Score the sample
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - id: bench
        name: Build and score all 30 commits
        run: python3 benchmarks/run.py
      - name: ${{ steps.bench.outputs.result }}
        run: cat .bench/report.json
      - name: ${{ steps.bench.outputs.precision }}
        run: cat .bench/precision.json
      - if: steps.bench.outputs.candidate != ''
        name: ${{ steps.bench.outputs.candidate }}
        run: cat .bench/candidate.json
      - id: ready
        name: Inspect the submission image and repository budget
        run: python3 benchmarks/readiness.py
      - name: ${{ steps.ready.outputs.result }}
        run: cat .bench/readiness.json
      - name: Check patch handling and worker cost in the submission image
        run: |
          docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,size=64m,mode=1777 --cpus 2 --memory 4096m \
            -v "$PWD/tests:/app/tests:ro" -w /app --entrypoint python \
            blast-radius-entry -m unittest discover -s tests -v
      - name: Test development tools against the source checkout
        run: |
          docker run --rm --network none --read-only --user 65534:65534 \
            --tmpfs /tmp:rw,size=64m,mode=1777 --cpus 2 --memory 4096m \
            -v "$PWD:/checkout:ro" -w /checkout --entrypoint python \
            blast-radius-entry -m unittest discover -s dev_tests -v
      - id: compare
        name: Compare selection strategies
        run: python3 benchmarks/compare.py
      - name: ${{ steps.compare.outputs.result }}
        run: cat .bench/strategies.json
      - id: profiles
        name: Isolate the contribution of each clean-base profile
        run: |
          summary=$(docker run --rm --network none --read-only --cpus 2 --memory 4096m \
            --tmpfs /tmp:rw,size=64m,mode=1777 --user 65534:65534 \
            -v "$PWD:/entry:ro" -w /entry --entrypoint python \
            blast-radius-entry benchmarks/profile_ablation.py)
          echo "result=$summary" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: ${{ steps.profiles.outputs.result }}
        run: echo 'Scores include 300 seconds per missed commit'
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: .bench/*.json
