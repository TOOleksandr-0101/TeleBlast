name: Comparison transfer corpus
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: "Prior successful run ID to replay. Leave empty for fresh full-suite labels."
        required: false
  push:
    branches: [main]
    paths: ['.github/workflows/transfer.yml', 'tools/transfer_cases.py']
permissions:
  contents: read
  actions: read
jobs:
  label:
    if: ${{ !inputs.evidence_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        case: [baseline, enumerated-row, fractional-boundary, lineage-arity, diff-threshold, timezone-arity-pair, alias-key, interval-unit, module-import-check]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tobymao/sqlglot
          ref: eb11aec4be8cb2122afe713a4816662c3f0fb2fa
          path: pinned
          persist-credentials: false
      - id: observed
        name: Run full pinned pytest suite and verify completeness
        env:
          CASE: ${{ matrix.case }}
        run: |
          mkdir -p .bench/evidence
          image=$(awk '$1 == "FROM" {print $2; exit}' Dockerfile)
          docker run --rm --cpus 2 --memory 4g -e CASE -e PYTHON_CPU_COUNT=2 -e OPENBLAS_NUM_THREADS=1 \
            -v "$PWD:/entry:ro" -v "$PWD/.bench/evidence:/result" -w /entry "$image" sh -ec '
              python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.lock
              GITHUB_OUTPUT=/result/ci-output python tools/transfer_cases.py measure "$CASE" /entry/pinned /result'
          cat .bench/evidence/ci-output >> "$GITHUB_OUTPUT"
      - name: ${{ steps.observed.outputs.case_result }}
        run: cat .bench/evidence/observed.json
      - name: Observed ${{ steps.observed.outputs.labels }}
        run: echo "Exact labels in the transfer artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-${{ matrix.case }}
          path: .bench/evidence
          include-hidden-files: true
  replay:
    needs: label
    if: ${{ always() && (needs.label.result == 'success' || inputs.evidence_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: transfer-*
          path: .bench/transfer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run || github.run_id }}
      - run: make build
      - id: replay
        name: Score the production image on frozen transfer labels
        run: python3 benchmarks/replay_mutations.py --corpus transfer .bench/transfer .bench/transfer-report.json
      - name: ${{ steps.replay.outputs.transfer }}
        run: echo "Seven operator mutations"
      - name: ${{ steps.replay.outputs.collection_control }}
        run: echo "Separate collection-failure control"
      - name: ${{ steps.replay.outputs.enumerated_row }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.fractional_boundary }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.lineage_arity }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.diff_threshold }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.timezone_arity_pair }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.alias_key }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.interval_unit }}
        run: echo "Selected and missed tests per strategy"
      - name: ${{ steps.replay.outputs.module_import_check }}
        run: echo "Selected and missed tests per strategy"
      - uses: actions/upload-artifact@v4
        with:
          name: scored-comparison-transfer
          path: .bench/transfer-report.json
          include-hidden-files: true
